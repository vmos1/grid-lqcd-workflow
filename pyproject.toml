[project]
name = "grid-lqcd-workflow"
version = "0.1.0"
description = "Python environment for the analysis, study and benchmark scripts of this workflow"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.4",
    "numpy>=1.20",
    "pandas>=1.3",
]

[tool.uv]
# Scripts, not an installable package: uv only manages the environment.
package = false
